[project]
name = "mmprobe"
version = "0.1.0"
description = "Sondes HTTP brutes pour les endpoints multimodaux compatibles OpenAI (audio/speech, audio/transcriptions, chat/completions image+audio)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",   # client HTTP (pas le SDK OpenAI : on veut le fil brut)
    "pillow>=10.1",  # génération des images de test uniquement
    "boto3>=1.40",   # cible Bedrock : le worker de la gateway appelle bedrock-runtime via boto3
]

[tool.uv]
package = false
